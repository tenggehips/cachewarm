[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenggehips-cachewarm"
version = "0.1.0"
description = "按命中率收益与预热成本排优先级，给出预热批次"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tenggehips" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tenggehips.github.io"
Repository = "https://github.com/tenggehips/cachewarm"
Issues = "https://github.com/tenggehips/cachewarm/issues"

[project.scripts]
cachewarm = "cachewarm:main"

[tool.setuptools]
py-modules = ["cachewarm"]
